<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recepty</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="theme-color" content="#2E6B3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F5EF;
  --card:#FFFFFF;
  --ink:#182420;
  --muted:#5D6B61;
  --line:#D7DDD3;
  --green:#2E6B3E;
  --green-deep:#1F4A2B;
  --green-soft:#E3EEE4;
  --mustard:#E0AB2D;
  --mustard-soft:#FBF0D2;
  --danger:#B3402E;
  --radius:18px;
  --nav-h:72px;
  --font-display:"Fraunces",Georgia,serif;
  --font-body:"Manrope",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:18px;line-height:1.5;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:var(--font-display);font-weight:700;line-height:1.15;margin:0}
h1{font-size:2.4rem}
h2{font-size:1.7rem}
h3{font-size:1.25rem}
p{margin:0 0 .75rem}
a{color:var(--green-deep)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--mustard);outline-offset:2px}
input[type=text],input[type=number],input[type=password],input[type=date],textarea,select{
  width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:.7rem .9rem;min-height:52px}
textarea{resize:vertical;line-height:1.5}
label{display:block;font-weight:700;margin:1.1rem 0 .4rem}
label small{font-weight:400;color:var(--muted)}
.hint{color:var(--muted);font-size:.92rem}

.page{max-width:1100px;margin:0 auto;padding:1.25rem 1.25rem 2rem}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem}
.page-head .sub{color:var(--muted);margin-top:.25rem}

.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:52px;padding:0 1.25rem;border-radius:14px;font-weight:700;background:var(--green);color:#fff;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn.secondary{background:var(--green-soft);color:var(--green-deep)}
.btn.ghost{background:transparent;color:var(--green-deep);border:1.5px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid var(--line)}
.btn.small{min-height:42px;padding:0 .9rem;font-size:.95rem;border-radius:11px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.btn-row{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1rem}

.search{display:flex;gap:.6rem;align-items:center;margin-bottom:1rem}
.search input{flex:1}
.chips{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.25rem}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:.45rem .95rem;font-weight:500;min-height:42px;display:inline-flex;align-items:center}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.kitchen{border-style:dashed}
.chip.kitchen.on{background:var(--mustard);color:var(--ink);border-color:var(--mustard);border-style:solid}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1rem}
.card{background:var(--card);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;text-align:left;box-shadow:0 1px 0 var(--line);width:100%}
.card .img{aspect-ratio:4/3;background:var(--green-soft);display:flex;align-items:center;justify-content:center;overflow:hidden}
.card .img img{width:100%;height:100%;object-fit:cover;display:block}
.card .img .ph{font-family:var(--font-display);font-size:3rem;color:var(--green);opacity:.55}
.card .body{padding:.85rem 1rem 1rem}
.card .title{font-family:var(--font-display);font-size:1.2rem;font-weight:700;line-height:1.2}
.card .tags{color:var(--muted);font-size:.88rem;margin-top:.35rem}

.empty{background:var(--card);border-radius:var(--radius);padding:2.5rem 1.5rem;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:.5rem}

/* detail */
.hero{border-radius:var(--radius);overflow:hidden;background:var(--green-soft);max-height:46vh;display:flex;align-items:center;justify-content:center}
.hero img{width:100%;max-height:46vh;object-fit:cover;display:block}
.hero .ph{font-family:var(--font-display);font-size:5rem;color:var(--green);opacity:.5;padding:3rem}
.detail-head{margin:1.25rem 0 .5rem}
.detail-head .meta{color:var(--muted);margin-top:.35rem}
.cols{display:grid;grid-template-columns:1fr;gap:1.5rem;margin-top:1.25rem}
@media(min-width:820px){.cols{grid-template-columns:minmax(260px,1fr) 2fr}}
.panel{background:var(--card);border-radius:var(--radius);padding:1.25rem}
.panel h3{margin-bottom:.75rem}
.servings{display:flex;align-items:center;gap:.5rem;margin-bottom:1rem}
.servings button{width:46px;height:46px;border-radius:12px;background:var(--green-soft);color:var(--green-deep);font-weight:700;font-size:1.3rem}
.servings .n{min-width:3ch;text-align:center;font-weight:700;font-size:1.2rem}
.ing-group{font-family:var(--font-display);font-weight:700;font-size:1.02rem;color:var(--green-deep);margin:1.1rem 0 .2rem;padding-bottom:.25rem;border-bottom:2px solid var(--green-soft)}
.panel .ing-group:first-of-type{margin-top:0}
.ing{list-style:none;margin:0;padding:0}
.ing li{display:flex;gap:.75rem;padding:.55rem 0;border-bottom:1px solid var(--line);align-items:baseline}
.ing li:last-child{border-bottom:0}
.ing .amt{font-weight:700;min-width:5.5ch;white-space:nowrap}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{display:flex;gap:1rem;padding:.9rem 0;border-bottom:1px solid var(--line);cursor:pointer}
.steps li:last-child{border-bottom:0}
.steps li .num{font-family:var(--font-display);font-size:1.6rem;font-weight:700;color:var(--green);min-width:2ch;line-height:1.2}
.steps li.done{color:var(--muted)}
.steps li.done .num{color:var(--line)}
.steps li.done .txt{text-decoration:line-through}
.note{background:var(--mustard-soft);border-radius:12px;padding:.8rem 1rem;margin-top:1rem}

/* cooking mode */
body.cook{padding-bottom:0}
body.cook .nav{display:none}
.cook-view{position:fixed;inset:0;background:var(--paper);z-index:20;display:flex;flex-direction:column}
.cook-top{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.25rem;gap:1rem}
.cook-top h2{font-size:1.4rem}
.cook-body{flex:1;overflow:auto;padding:0 1.25rem 2rem}
.cook-body .cols{margin-top:0}
.cook-body{font-size:1.25rem}
.cook-body .steps li .num{font-size:2.2rem}
.cook-body .steps li{padding:1.2rem 0}

/* form */
.form .ai-box{background:var(--green-soft);border-radius:var(--radius);padding:1rem 1.25rem;margin-bottom:.5rem}
.form .ai-box textarea{margin-top:.5rem}
.form .ai-box .btn.secondary{background:#fff}
.errbox{background:#FBE9E5;border-radius:12px;padding:.8rem 1rem;margin-top:.75rem;font-size:.95rem;color:#7A2718}
.imgpick{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.imgpick .prev{width:160px;height:120px;border-radius:12px;background:var(--green-soft);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.9rem;text-align:center;padding:.5rem}
.imgpick .prev img{width:100%;height:100%;object-fit:cover}
.tagpick{display:flex;flex-wrap:wrap;gap:.5rem}
.tagpick .chip{cursor:pointer}
.tag-group{margin-bottom:.75rem}
.tag-group .hint{margin-bottom:.4rem}

/* plan */
.week{display:grid;grid-template-columns:1fr;gap:.75rem}
@media(min-width:720px){.week{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1000px){.week{grid-template-columns:repeat(4,1fr)}}
.day{background:var(--card);border-radius:var(--radius);padding:1rem;display:flex;flex-direction:column;gap:.6rem}
.day .dname{font-weight:700}
.day .dname small{color:var(--muted);font-weight:400;margin-left:.35rem}
.day .pick{display:flex;gap:.6rem;align-items:center}
.day .pick .thumb{width:56px;height:56px;border-radius:10px;background:var(--green-soft);overflow:hidden;flex:none}
.day .pick .thumb img{width:100%;height:100%;object-fit:cover}
.day select{min-height:46px}
.day a.open{font-size:.92rem}
.history{margin-top:2rem}
.history .item{display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:12px;padding:.75rem 1rem;margin-bottom:.5rem;gap:1rem}

/* shopping */
.shop{list-style:none;margin:0;padding:0;background:var(--card);border-radius:var(--radius);overflow:hidden}
.shop li{display:flex;align-items:center;gap:.9rem;padding:.75rem 1rem;border-bottom:1px solid var(--line)}
.shop li:last-child{border-bottom:0}
.shop li input{width:26px;height:26px;flex:none;accent-color:var(--green)}
.shop li.done .t{text-decoration:line-through;color:var(--muted)}
.shop li .t{flex:1}
.shop li .amt{font-weight:700;white-space:nowrap}
.shop li a{font-size:.9rem;white-space:nowrap}
.shop-uses{color:var(--muted);font-size:.85rem}

/* settings */
.set-block{background:var(--card);border-radius:var(--radius);padding:1.25rem;margin-bottom:1rem}
.set-block h3{margin-bottom:.25rem}
.status{margin-top:.6rem;font-size:.95rem}
.status.ok{color:var(--green-deep)}
.status.err{color:var(--danger)}
.kv{display:flex;justify-content:space-between;gap:1rem;padding:.4rem 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;z-index:10}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;text-decoration:none;color:var(--muted);font-size:.85rem;font-weight:500}
.nav a svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav a.on{color:var(--green-deep)}
.nav a.on svg{stroke-width:2.4}

/* toast + busy */
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 1.25rem);transform:translateX(-50%);background:var(--ink);color:#fff;padding:.8rem 1.2rem;border-radius:12px;z-index:30;max-width:90vw;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.busy{display:inline-block;width:18px;height:18px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle}
.btn.secondary .busy,.btn.ghost .busy{border-color:rgba(31,74,43,.25);border-top-color:var(--green-deep)}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.busy{animation-duration:1.6s}.toast{transition:none}}
.hidden{display:none!important}
</style>
</head>

<main id="app" class="page"></main>

  <a href="#/jidelnicek" data-tab="jidelnicek"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Jídelníček</a>
  <a href="#/nakup" data-tab="nakup"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.5 11h11L21 7H6.5"/><circle cx="9" cy="20" r="1.5"/><circle cx="17" cy="20" r="1.5"/></svg>Nákup</a>
  <a href="#/nastaveni" data-tab="nastaveni"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>Nastavení</a>
</nav>
<div class="toast" id="toast"></div>

<script>
/* ---------------- konstanty ---------------- */
const TAGS_TYPE = ['hlavní jídlo','sladké jídlo','dezert','bezmasé','salát','chléb a pečivo','polévka','těstoviny','rizoto'];
const TAGS_KITCHEN = ['česká','italská','asijská','indická'];
const ALL_TAGS = [...TAGS_TYPE, ...TAGS_KITCHEN];
const UNITS = ['g','kg','ml','l','dl','ks','lžíce','lžička','lžic','lžiček','hrnek','hrnky','šálek','špetka','balení','plátek','plátky','stroužek','stroužky','svazek','sáček','konzerva','kostka'];
const DAYS = ['pondělí','úterý','středa','čtvrtek','pátek','sobota','neděle'];
const DEFAULTS = {
  apiKey:'', textModel:'gemini-3.6-flash'
};

/* ---------------- úložiště ---------------- */
const DB = {
  db:null,
  open(){
    return new Promise((res,rej)=>{
      const r = indexedDB.open('recepty',1);
      r.onupgradeneeded = e=>{
        const d = e.target.result;
        if(!d.objectStoreNames.contains('recipes')) d.createObjectStore('recipes',{keyPath:'id'});
        if(!d.objectStoreNames.contains('plans')) d.createObjectStore('plans',{keyPath:'id'});
      };
      r.onsuccess = e=>{ this.db=e.target.result; res(); };
      r.onerror = e=>rej(e.target.error);
    });
  },
  tx(store,mode,fn){
    return new Promise((res,rej)=>{
      const t = this.db.transaction(store,mode);
      const s = t.objectStore(store);
      const req = fn(s);
      t.oncomplete = ()=>res(req && req.result);
      t.onerror = e=>rej(e.target.error);
    });
  },
  all(store){ return this.tx(store,'readonly',s=>s.getAll()); },
  get(store,id){ return this.tx(store,'readonly',s=>s.get(id)); },
  put(store,obj){ return this.tx(store,'readwrite',s=>s.put(obj)); },
  del(store,id){ return this.tx(store,'readwrite',s=>s.delete(id)); },
  clear(store){ return this.tx(store,'readwrite',s=>s.clear()); }
};
const settings = {
  get(){ try{
      const o = Object.assign({},DEFAULTS,JSON.parse(localStorage.getItem('settings')||'{}'));
      if(o.textModel==='gemini-2.5-flash') o.textModel = DEFAULTS.textModel; // starý výchozí model Google zrušil
      return o;
    }catch{ return {...DEFAULTS}; } },
  set(obj){ localStorage.setItem('settings',JSON.stringify(Object.assign(this.get(),obj))); }
};
const uid = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ---------------- pomocné ---------------- */
const $ = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>[...el.querySelectorAll(s)];
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2600); }
function busy(btn,on,label){ if(!btn) return; if(on){ btn.dataset.label=btn.innerHTML; btn.innerHTML='<span class="busy"></span> '+(label||'Pracuji…'); btn.disabled=true; btn.style.pointerEvents='none'; } else { btn.innerHTML=btn.dataset.label||btn.innerHTML; btn.disabled=false; btn.style.pointerEvents=''; } }

function parseAmount(str){
  if(!str) return null;
  str = str.trim().replace(',', '.');
  const frac = {'½':0.5,'¼':0.25,'¾':0.75,'⅓':1/3,'⅔':2/3};
  let total=0, ok=false;
  for(const part of str.split(/\s+/)){
    if(frac[part]!==undefined){ total+=frac[part]; ok=true; }
    else if(/^\d+\/\d+$/.test(part)){ const [a,b]=part.split('/'); total+=a/b; ok=true; }
    else if(/^\d+(\.\d+)?$/.test(part)){ total+=parseFloat(part); ok=true; }
    else if(/^\d+(\.\d+)?-\d+(\.\d+)?$/.test(part)){ total+=parseFloat(part.split('-')[0]); ok=true; }
    else return ok?total:null;
  }
  return ok?total:null;
}
function fmtAmount(n){
  if(n==null||isNaN(n)) return '';
  if(n>=20) return String(Math.round(n));            // gramy, mililitry – zlomky nedávají smysl
  if(n>=10) return String(Math.round(n*2)/2).replace('.',',');
  const q = Math.round(n*4)/4;                        // menší množství zaokrouhlíme na čtvrtiny
  const whole = Math.floor(q), rest = q-whole;
  const near = [[0.25,'¼'],[0.5,'½'],[0.75,'¾']];
  for(const [v,sym] of near){ if(Math.abs(rest-v)<0.01) return (whole?whole:'')+sym; }
  return String(whole||q).replace('.',',');
}
// "200 g hladké mouky" -> {amount:200, unit:'g', name:'hladké mouky', raw}
function parseIngredientLine(line){
  const raw=line.trim(); if(!raw) return null;
  const m = raw.match(/^([\d.,/½¼¾⅓⅔\s-]+?)\s*(?=[^\d.,/½¼¾⅓⅔\s-]|$)(.*)$/);
  let amount=null, rest=raw;
  if(m && parseAmount(m[1])!=null){ amount=parseAmount(m[1]); rest=m[2].trim(); }
  let unit='', name=rest;
  const um = rest.match(/^([^\s]+)\s+(.+)$/);
  if(um && UNITS.includes(um[1].toLowerCase())){ unit=um[1]; name=um[2]; }
  return {amount, unit, name, raw};
}
// Řádek zakončený dvojtečkou ("Na těsto:") zahajuje novou skupinu ingrediencí.
function parseIngredientBlock(text){
  const out=[]; let group='';
  for(const line of String(text||'').split('\n')){
    const t=line.trim(); if(!t) continue;
    if(/:$/.test(t) && !/\d/.test(t.slice(0,2))){ group=t.replace(/:$/,'').trim(); continue; }
    const ing=parseIngredientLine(t); if(!ing) continue;
    if(group) ing.group=group;
    out.push(ing);
  }
  return out;
}
function ingredientsToText(list){
  let group='', out=[];
  for(const i of (list||[])){
    const g=i.group||'';
    if(g!==group){ if(g) out.push((out.length?'\n':'')+g+':'); group=g; }
    out.push(i.raw);
  }
  return out.join('\n');
}
// [{group:'Na těsto', items:[…]}, …]
function groupIngredients(list){
  const groups=[];
  for(const i of (list||[])){
    const g=i.group||'';
    if(!groups.length || groups[groups.length-1].group!==g) groups.push({group:g, items:[]});
    groups[groups.length-1].items.push(i);
  }
  return groups;
}
function ingredientText(i, factor=1){
  const a = i.amount!=null ? fmtAmount(i.amount*factor) : '';
  return {amt:[a,i.unit].filter(Boolean).join(' '), name:i.name||i.raw};
}
function mondayOf(d){ const x=new Date(d); const day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); x.setHours(0,0,0,0); return x; }
const iso = d=>d.toISOString().slice(0,10);
const fmtDate = s=>{ const d=new Date(s); return d.getDate()+'. '+(d.getMonth()+1)+'.'; };
function nameForm(n){ return n===1?'porce':(n>=2&&n<=4?'porce':'porcí'); }

async function fileToDataUrl(file, max=1000, quality=0.82){
  const url = URL.createObjectURL(file);
  const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
  const scale = Math.min(1, max/Math.max(img.width,img.height));
  const c=document.createElement('canvas'); c.width=Math.round(img.width*scale); c.height=Math.round(img.height*scale);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  URL.revokeObjectURL(url);
  return c.toDataURL('image/jpeg',quality);
}

/* ---------------- Gemini ---------------- */
// Doporučené modely – seznam z API nemusí nové modely obsahovat, proto je nabízíme i takto.
const KNOWN_MODELS = ['gemini-3.6-flash','gemini-3.5-flash-lite','gemini-3.5-flash','gemini-3.1-flash-lite','gemini-2.5-flash','gemini-2.5-flash-lite'];
const Gemini = {
  check(){ if(!settings.get().apiKey) throw new Error('Nejdřív vlož API klíč v Nastavení.'); },
  async post(url, body, timeout=120000){
    const s=settings.get();
    const ctrl = new AbortController();
    const timer = setTimeout(()=>ctrl.abort(), timeout);
    let r;
    try{
      r = await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':s.apiKey},body:JSON.stringify(body),signal:ctrl.signal});
    }catch(err){
      if(err.name==='AbortError') throw new Error('Odpověď nepřišla do 2 minut. Zkus méně nebo menší fotek, případně jiný model.');
      throw new Error('Nepodařilo se spojit s Googlem – zkontroluj připojení k internetu.');
    }finally{ clearTimeout(timer); }
    if(!r.ok){
      let msg='HTTP '+r.status;
      try{ const j=await r.json(); msg=j.error?.message||msg; }catch{}
      const e=new Error(msg); e.status=r.status; throw e;
    }
    return r.json();
  },
  hint(err){
    const m=err.message||'';
    if(/no longer available|not found|not supported/i.test(m)) return new Error(m+' — vyber v Nastavení jiný model.');
    if(err.status===429) return new Error(m+' (limit požadavků – zkus to za chvíli nebo vyber jiný model.)');
    return err;
  },
  parts(url){ const [meta,data]=url.split(','); return {mime:meta.match(/data:(.*?);/)[1], data}; },
  // Nové rozhraní (Interactions API) s automatickým návratem ke staršímu generateContent.
  async json(prompt, images=[]){
    this.check();
    const s=settings.get(); const model=s.textModel;
    let text=null, firstErr=null;
    try{
      const input=[{type:'text',text:prompt}];
      for(const u of images){ const p=this.parts(u); input.push({type:'image', mime_type:p.mime, data:p.data}); }
      const d = await this.post('https://generativelanguage.googleapis.com/v1beta/interactions',{model,input,generation_config:{thinking_level:'low'}});
      text = this.readInteraction(d);
    }catch(err){
      firstErr = err;
      if(!(err.status===404 || err.status===400)) throw this.hint(err);
    }
    if(text===null){
      try{
        const parts = images.map(u=>{ const p=this.parts(u); return {inlineData:{mimeType:p.mime, data:p.data}}; });
        parts.push({text:prompt});
        const d = await this.post(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{contents:[{parts}],generationConfig:{responseMimeType:'application/json'}});
        text = (d.candidates?.[0]?.content?.parts||[]).map(x=>x.text||'').join('');
      }catch(err){ throw this.hint(firstErr && firstErr.status!==404 ? firstErr : err); }
    }
    const clean = String(text||'').replace(/```json|```/g,'').trim();
    const m = clean.match(/[{[][\s\S]*[}\]]/);
    if(!m) throw new Error('Model nevrátil použitelnou odpověď. Zkus to znovu nebo vyber jiný model.');
    return JSON.parse(m[0]);
  },
  readInteraction(d){
    const out=[];
    for(const o of (d.outputs||[])) if(o.type==='text'&&o.text) out.push(o.text);
    for(const st of (d.steps||[])) for(const c of (st.content||[])) if(c.type==='text'&&c.text) out.push(c.text);
    return out.join('\n');
  },
  async models(){
    this.check();
    const s=settings.get();
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?pageSize=200`,{headers:{'x-goog-api-key':s.apiKey}});
    if(!r.ok) throw new Error('Klíč nefunguje (HTTP '+r.status+').');
    const j = await r.json();
    const listed = (j.models||[]).map(m=>m.name.replace('models/','')).filter(n=>!/embedding|aqa|tts|veo|imagen/i.test(n));
    return [...new Set([...KNOWN_MODELS, ...listed])];
  }
};

/* ---------------- stav + routování ---------------- */
let recipes=[], plans=[];
const state = { q:'', tags:new Set(), doneSteps:new Set(), servings:null, wakeLock:null };

async function reload(){ recipes = (await DB.all('recipes')).sort((a,b)=>a.name.localeCompare(b.name,'cs')); plans = (await DB.all('plans')).sort((a,b)=>b.weekStart.localeCompare(a.weekStart)); }

function route(){
  const h = location.hash || '#/recepty';
  const [_, view, id] = h.split('/');
  document.body.classList.remove('cook');
  releaseWake();
  $$('#nav a').forEach(a=>a.classList.toggle('on', a.dataset.tab===(['recept','upravit','novy'].includes(view)?'recepty':view)));
  const app=$('#app');
  ({recepty:viewLibrary, recept:viewDetail, vareni:viewCook, upravit:viewForm, novy:viewForm, jidelnicek:viewPlan, nakup:viewShop, nastaveni:viewSettings}[view]||viewLibrary)(app,id);
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);

/* ---------------- knihovna ---------------- */
function recipeCard(r){

  return `<button class="card" onclick="location.hash='#/recept/${r.id}'">
    <div class="img">${r.image?`<img src="${r.image}" alt="">`:`<span class="ph">${esc(r.name[0]||'?')}</span>`}</div>
    <div class="body"><div class="title">${esc(r.name)}</div>${tags?`<div class="tags">${esc(tags)}</div>`:''}</div>
  </button>`;
}
function viewLibrary(app){
  const q = state.q.toLowerCase();
  const list = recipes.filter(r=>{
    if(q && !(r.name.toLowerCase().includes(q) || r.ingredients.some(i=>(i.name||i.raw).toLowerCase().includes(q)))) return false;
    for(const t of state.tags) if(!r.tags.includes(t)) return false;
    return true;
  });
  app.innerHTML = `
    <div class="page-head">
      <div><h1>Recepty</h1><div class="sub">${recipes.length} ${recipes.length===1?'recept':recipes.length<5&&recipes.length>0?'recepty':'receptů'}</div></div>

      recipes.length?`<div class="empty"><h3>Nic neodpovídá</h3>Zkus jiný filtr nebo jiné slovo.</div>`:
      `<div class="empty"><h3>Zatím tu nic není</h3>Přidej první recept – klidně jen vlož text a nech ho rozdělit automaticky.<div class="btn-row" style="justify-content:center"><a class="btn" href="#/novy">+ Nový recept</a></div></div>`}`;

/* ---------------- detail + vaření ---------------- */
function detailBody(r, cook){

  return `
    <div class="cols">
      <div class="panel">

          <ul class="ing">${g.items.map(i=>{ const t=ingredientText(i,factor); return `<li><span class="amt">${esc(t.amt)}</span><span>${esc(t.name)}</span></li>`; }).join('')}</ul>`).join('')}

function bindDetail(r, rerender){
  $$('[data-s]').forEach(b=>b.addEventListener('click',()=>{ const base=r.servings||1; state.servings=Math.max(1,(state.servings||base)+Number(b.dataset.s)); rerender(); }));
  $$('.steps li').forEach(li=>li.addEventListener('click',()=>{ const i=Number(li.dataset.i); state.doneSteps.has(i)?state.doneSteps.delete(i):state.doneSteps.add(i); li.classList.toggle('done'); }));
}
async function viewDetail(app,id){
  const r = recipes.find(x=>x.id===id);
  if(!r){ app.innerHTML=`<div class="empty"><h3>Recept nenalezen</h3><a href="#/recepty">Zpět na recepty</a></div>`; return; }
  if(app.dataset.rid!==id){ state.doneSteps=new Set(); state.servings=null; app.dataset.rid=id; }
  const render = ()=>{
    app.innerHTML = `
      <div class="hero">${r.image?`<img src="${r.image}" alt="">`:`<span class="ph">${esc(r.name[0]||'?')}</span>`}</div>
      <div class="detail-head"><h1>${esc(r.name)}</h1><div class="meta">${esc(r.tags.join(', '))}${r.source?` · ${esc(r.source)}`:''}</div></div>
      <div class="btn-row">
        <a class="btn" href="#/vareni/${r.id}">Začít vařit</a>
        <a class="btn ghost" href="#/upravit/${r.id}">Upravit</a>
        <button class="btn danger" id="del">Smazat</button>
      </div>
      ${detailBody(r)}`;
    bindDetail(r, render);
    $('#del').addEventListener('click',async()=>{ if(!confirm(`Smazat „${r.name}“?`)) return; await DB.del('recipes',r.id); await reload(); toast('Recept smazán'); location.hash='#/recepty'; });
  };
  render();
}
async function viewCook(app,id){
  const r = recipes.find(x=>x.id===id); if(!r){ location.hash='#/recepty'; return; }
  if(app.dataset.rid!==id){ state.doneSteps=new Set(); state.servings=null; app.dataset.rid=id; }
  document.body.classList.add('cook');
  const render = ()=>{
    app.innerHTML = `<div class="cook-view">
      <div class="cook-top"><h2>${esc(r.name)}</h2><a class="btn ghost small" href="#/recept/${r.id}">Ukončit</a></div>
      <div class="cook-body">${detailBody(r,true)}</div></div>`;
    bindDetail(r, render);
  };
  render();
  requestWake();
}
async function requestWake(){ try{ if('wakeLock' in navigator){ state.wakeLock = await navigator.wakeLock.request('screen'); } }catch{} }
function releaseWake(){ if(state.wakeLock){ state.wakeLock.release().catch(()=>{}); state.wakeLock=null; } }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && document.body.classList.contains('cook')) requestWake(); });

/* ---------------- jídelníček ---------------- */
let planDraft=null;
function newDraft(monday){ return {id:uid(), weekStart:iso(monday), days:DAYS.map((_,i)=>{ const d=new Date(monday); d.setDate(d.getDate()+i); return {date:iso(d), recipeId:null}; }), created:Date.now()}; }
function viewPlan(app){
  if(!planDraft){ const thisMon=mondayOf(new Date()); planDraft = plans.find(p=>p.weekStart===iso(thisMon)) ? JSON.parse(JSON.stringify(plans.find(p=>p.weekStart===iso(thisMon)))) : newDraft(thisMon); }
  const p=planDraft;
  const opts = sel=>`<option value="">— nic —</option>`+recipes.map(r=>`<option value="${r.id}" ${r.id===sel?'selected':''}>${esc(r.name)}</option>`).join('');
  app.innerHTML = `
    <div class="page-head">
      <div><h1>Jídelníček</h1><div class="sub">týden od ${fmtDate(p.weekStart)}</div></div>
      <div class="btn-row" style="margin:0"><button class="btn ghost small" id="prevw">◀ Týden</button><button class="btn ghost small" id="nextw">Týden ▶</button></div>
    </div>
    ${recipes.length<3?`<div class="empty"><h3>Málo receptů</h3>Pro jídelníček se hodí alespoň pár uložených receptů. <a href="#/novy">Přidat recept</a></div>`:`

      <label for="wish" style="margin-top:0">Přání pro tento týden <small>– nepovinné</small></label>
      <input type="text" id="wish" placeholder="např. 2× bezmasé, v pátek něco rychlého, žádnou italskou">
      <div class="btn-row"><button class="btn" id="ai">Sestavit z mých receptů</button><button class="btn secondary" id="rnd">Náhodně</button></div>
    </div>`}
    <div class="week">${p.days.map((d,i)=>{ const r=recipes.find(x=>x.id===d.recipeId); return `<div class="day">
      <div class="dname">${DAYS[i]}<small>${fmtDate(d.date)}</small></div>
      <div class="pick"><div class="thumb">${r?.image?`<img src="${r.image}" alt="">`:''}</div><select data-i="${i}">${opts(d.recipeId)}</select></div>
      ${r?`<a class="open" href="#/recept/${r.id}">Otevřít recept</a>`:''}
    </div>`; }).join('')}</div>
    <div class="btn-row"><button class="btn" id="saveplan">Uložit jídelníček</button><a class="btn ghost" href="#/nakup">Nákupní seznam</a></div>
    ${plans.length?`<div class="history"><h3>Uložené týdny</h3>${plans.map(x=>`<div class="item"><span>Týden od ${fmtDate(x.weekStart)} · ${x.days.filter(d=>d.recipeId).length} jídel</span><span><button class="btn ghost small" data-load="${x.id}">Otevřít</button> <button class="btn danger small" data-delp="${x.id}">Smazat</button></span></div>`).join('')}</div>`:''}`;

  const shift = n=>{ const m=new Date(p.weekStart); m.setDate(m.getDate()+7*n); const ex=plans.find(x=>x.weekStart===iso(m)); planDraft = ex?JSON.parse(JSON.stringify(ex)):newDraft(m); viewPlan(app); };
  $('#prevw').addEventListener('click',()=>shift(-1)); $('#nextw').addEventListener('click',()=>shift(1));
  $$('.day select').forEach(s=>s.addEventListener('change',()=>{ p.days[s.dataset.i].recipeId=s.value||null; viewPlan(app); }));

  $('#ai')?.addEventListener('click',async e=>{
    busy(e.target,true,'Sestavuji…');

      const list = recipes.map(r=>({id:r.id,name:r.name,tags:r.tags}));

Recepty: ${JSON.stringify(list)}`);
      const ids=new Set(recipes.map(r=>r.id));
      (j.days||[]).forEach(d=>{ const i=DAYS.indexOf((d.day||'').toLowerCase()); if(i>=0 && ids.has(d.recipeId)) p.days[i].recipeId=d.recipeId; });

  });
  $('#saveplan').addEventListener('click',async()=>{ await DB.put('plans',p); await reload(); toast('Jídelníček uložen'); viewPlan(app); });
  $$('[data-load]').forEach(b=>b.addEventListener('click',()=>{ planDraft=JSON.parse(JSON.stringify(plans.find(x=>x.id===b.dataset.load))); viewPlan(app); }));
  $$('[data-delp]').forEach(b=>b.addEventListener('click',async()=>{ if(!confirm('Smazat tento týden?')) return; await DB.del('plans',b.dataset.delp); await reload(); if(planDraft.id===b.dataset.delp) planDraft=null; viewPlan(app); }));
}

/* ---------------- nákup ---------------- */
function viewShop(app){
  const p = planDraft || plans[0];
  const items = new Map();
  const used = p ? p.days.map(d=>recipes.find(r=>r.id===d.recipeId)).filter(Boolean) : [];
  for(const r of used){ for(const i of r.ingredients){
    const key=(i.name||i.raw).toLowerCase().trim()+'|'+(i.unit||'').toLowerCase();
    const cur=items.get(key)||{name:i.name||i.raw,unit:i.unit,amount:0,hasAmount:false,uses:new Set()};
    if(i.amount!=null){ cur.amount+=i.amount; cur.hasAmount=true; }
    cur.uses.add(r.name); items.set(key,cur);
  } }
  const list=[...items.values()].sort((a,b)=>a.name.localeCompare(b.name,'cs'));
  const line = it=>[it.hasAmount?fmtAmount(it.amount):'',it.unit,it.name].filter(Boolean).join(' ');
  app.innerHTML = `
    <div class="page-head"><div><h1>Nákup</h1><div class="sub">${p?`z jídelníčku od ${fmtDate(p.weekStart)} · ${used.length} jídel`:'žádný jídelníček'}</div></div>
      ${list.length?`<button class="btn" id="copy">Zkopírovat seznam</button>`:''}</div>
    ${list.length?`<ul class="shop">${list.map((it,i)=>`<li data-i="${i}"><input type="checkbox" id="c${i}"><label for="c${i}" class="t" style="margin:0;font-weight:500">${esc(it.name)}<div class="shop-uses">${esc([...it.uses].join(', '))}</div></label><span class="amt">${esc([it.hasAmount?fmtAmount(it.amount):'',it.unit].filter(Boolean).join(' '))}</span></li>`).join('')}</ul>
    <p class="hint" style="margin-top:1rem">Seznam se skládá z jídelníčku, který máš zrovna otevřený.</p>`
    :`<div class="empty"><h3>Prázdný seznam</h3>Nejdřív sestav jídelníček. <a href="#/jidelnicek">Jídelníček</a></div>`}`;
  $$('.shop li input').forEach(c=>c.addEventListener('change',()=>c.closest('li').classList.toggle('done',c.checked)));
  $('#copy')?.addEventListener('click',async()=>{
    const text = 'Nákupní seznam\n'+list.map(it=>'- '+line(it)).join('\n');
    try{ await navigator.clipboard.writeText(text); toast('Seznam zkopírován'); }catch{ prompt('Zkopíruj text:',text); }
  });
}

/* ---------------- nastavení ---------------- */
function viewSettings(app){
  const s=settings.get();
  const sizeMB = (JSON.stringify(recipes).length/1048576).toFixed(1);
  app.innerHTML = `
    <div class="page-head"><h1>Nastavení</h1></div>
    <div class="set-block">
      <h3>Gemini</h3>
      <p class="hint">Klíč vytvoříš zdarma v Google AI Studiu (aistudio.google.com → Get API key). Ukládá se jen v tomto zařízení.</p>
      <label for="key">API klíč</label><input type="password" id="key" value="${esc(s.apiKey)}" autocomplete="off">
      <div class="btn-row"><button class="btn secondary" id="test">Ověřit klíč a načíst modely</button></div>
      <div class="status" id="st"></div>
      <label for="tm">Model <small>(přepis receptů z fotky, jídelníček)</small></label>
      <input type="text" id="tm" list="models" value="${esc(s.textModel)}">
      <datalist id="models"></datalist>
      <p class="hint" style="margin-top:.75rem">Vyber Flash nebo Flash-Lite model – umí číst fotky i text a bývají v bezplatném tarifu. V nabídce jsou i modely, které seznam z Googlu nevrací; pokud u některého přijde chyba, zkus jiný.</p>
    </div>
    <div class="btn-row"><button class="btn" id="save">Uložit nastavení</button></div>
    <div class="set-block" style="margin-top:1.5rem">
      <h3>Záloha</h3>
      <div class="kv"><span>Recepty</span><span>${recipes.length}</span></div>
      <div class="kv"><span>Jídelníčky</span><span>${plans.length}</span></div>
      <div class="kv"><span>Velikost dat</span><span>${sizeMB} MB</span></div>
      <div class="btn-row"><button class="btn secondary" id="exp">Stáhnout zálohu (JSON)</button><label class="btn ghost" for="impf" style="margin:0">Obnovit ze zálohy</label><input type="file" id="impf" accept="application/json" class="hidden"></div>
      <p class="hint" style="margin-top:.75rem">Obnova přidá recepty ze zálohy k těm stávajícím; stejné recepty (podle id) přepíše.</p>
    </div>`;
  $('#save').addEventListener('click',()=>{ settings.set({apiKey:$('#key').value.trim(), textModel:$('#tm').value.trim()}); toast('Nastavení uloženo'); });
  $('#test').addEventListener('click',async e=>{
    settings.set({apiKey:$('#key').value.trim()});
    busy(e.target,true,'Ověřuji…'); const st=$('#st');
    try{ const m=await Gemini.models(); $('#models').innerHTML=m.map(x=>`<option value="${esc(x)}">`).join(''); st.className='status ok'; st.textContent=`Klíč funguje. Klepni do pole Model a vyber ze seznamu (${m.length} položek).`; }
    catch(err){ st.className='status err'; st.textContent=err.message; }
    busy(e.target,false);
  });
  $('#exp').addEventListener('click',()=>{
    const blob=new Blob([JSON.stringify({version:1,exported:new Date().toISOString(),recipes,plans},null,1)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`recepty-${iso(new Date())}.json`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  });
  $('#impf').addEventListener('change',async e=>{
    const f=e.target.files[0]; if(!f) return;
    try{
      const j=JSON.parse(await f.text());
      if(!Array.isArray(j.recipes)) throw new Error('Soubor nevypadá jako záloha receptů.');
      for(const r of j.recipes) await DB.put('recipes',r);
      for(const p of (j.plans||[])) await DB.put('plans',p);
      await reload(); planDraft=null; toast(`Obnoveno: ${j.recipes.length} receptů`); viewSettings(app);
    }catch(err){ toast(err.message); }
  });
}

/* ---------------- start ---------------- */
(async()=>{
  await DB.open(); await reload(); route();
  if('serviceWorker' in navigator && location.protocol.startsWith('http')){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
})();
</script>
</body>
</html>
